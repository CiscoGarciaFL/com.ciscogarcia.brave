<?xml version="1.0" encoding="UTF-8"?>
<!--
  Composite: official Brave browser lion (brave.com) inside a KDE Plasma widget frame.
  Brave lion paths © Brave Software, Inc. Used under fair use for widget identification.
  Frame and composite © 2024 CiscoGarciaFL, Apache-2.0.
-->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Plasma frame background gradient (Breeze Dark palette) -->
    <linearGradient id="plasma_bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#454c5c"/>
      <stop offset="100%" stop-color="#2d3035"/>
    </linearGradient>

    <!-- Plasma accent border gradient (Breeze Blue) -->
    <linearGradient id="plasma_border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5294e2"/>
      <stop offset="100%" stop-color="#3daee9"/>
    </linearGradient>

    <!-- Brave lion: main shield gradient (orange→red), coordinates match original 56×64 space -->
    <linearGradient id="brave_g0" x1=".671" y1="64.319" x2="55.2" y2="64.319" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FF5500"/>
      <stop offset=".41"  stop-color="#FF5500"/>
      <stop offset=".582" stop-color="#FF2000"/>
      <stop offset="1"    stop-color="#FF2000"/>
    </linearGradient>

    <!-- Brave lion: top-cap gradient -->
    <linearGradient id="brave_g1" x1="6.278" y1="11.466" x2="50.565" y2="11.466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF452A"/>
      <stop offset="1" stop-color="#FF2000"/>
    </linearGradient>
  </defs>

  <!-- ── Plasma widget frame ─────────────────────────────────────────── -->
  <rect x="1"   y="1"   width="62" height="62" rx="10" fill="url(#plasma_bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="9.5" fill="none"
        stroke="url(#plasma_border)" stroke-width="1.5"/>
  <!-- Subtle top highlight to mimic a Plasma panel shine -->
  <rect x="4" y="2" width="56" height="3" rx="2" fill="white" opacity="0.07"/>

  <!-- ── Brave lion, scaled to 0.875 and centered (7.5 px L/R, 4 px T/B) ── -->
